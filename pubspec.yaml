name: colada_sdk
description: >-
  Mobile attribution & marketing performance for Flutter apps: track ad
  campaigns, social media ads, ROAS and conversions across every channel in one
  place.
version: 0.2.1
repository: https://github.com/3laween/colada-sdk-flutter
homepage: https://masar-ai.manus.space/
issue_tracker: https://github.com/3laween/colada-sdk-flutter/issues

# pub.dev discoverability tags (max 5).
topics:
  - attribution
  - marketing
  - analytics
  - advertising
  - ads

# Floors are set at what the code actually needs (sealed classes, records),
# not at the local toolchain version, so integrators on slightly older stable
# channels are not locked out.
environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Declared now for later phases: plugin_platform_interface (in case a third
  # platform ever forces federation, D4) and pigeon (the Dart<->native schema
  # generator, first used in Phase 4).
  plugin_platform_interface: ^2.1.8
  # Exact-pinned, not ^27.3.0: pigeon stamps its own version into every generated
  # file's header comment, so a floating constraint makes "Pigeon codegen is
  # current" flaky — it fails whenever pub.dev ships a new pigeon patch between
  # a local regen and CI's `flutter pub get`, with no schema change involved.
  pigeon: 27.3.1

# This is a method-channel plugin, not a Dart-only or federated one, so it
# declares android + ios directly with no default_package and no
# dartPluginClass. The Android package namespace is io.coladaapp.sdk.flutter,
# deliberately distinct from the native SDK's own io.coladaapp.sdk namespace to
# avoid a collision in the merged manifest.
flutter:
  plugin:
    platforms:
      android:
        package: io.coladaapp.sdk.flutter
        pluginClass: ColadaSdkPlugin
      ios:
        pluginClass: ColadaSdkPlugin
