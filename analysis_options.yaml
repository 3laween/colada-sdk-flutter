include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # A published SDK's dartdoc is its documentation. Enforce docs on every
    # public member, mirroring the native Android SDK's checkPublicKdoc gate.
    public_member_api_docs: true
