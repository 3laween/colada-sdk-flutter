group = 'io.coladaapp.sdk.flutter'
version = '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.1'
        // NO kotlin-gradle-plugin classpath, and no `apply plugin:
        // 'kotlin-android'` below. Flutter now applies the Kotlin Gradle Plugin
        // itself and picks the version for the app and every plugin together
        // ("Built-in Kotlin"). A plugin that brings its own makes the host app
        // reconcile several Kotlin versions in one build — and future Flutter
        // releases reject such plugins outright, which would break every app
        // that depends on this package, in a file they cannot patch.
        // See: docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
    }
}

rootProject.allprojects {
    repositories {
        // Only public repositories. The native Colada Android SDK (added in
        // Phase 5) is published to Maven Central; there is deliberately no
        // GitHub Packages maven { url ... } block and no credentials {} block.
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace = 'io.coladaapp.sdk.flutter'
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // Matches the native Colada Android SDK floor (minSdk 23). The host app
        // must build with compileSdk >= 36 and JDK 17.
        minSdk = 23
    }
}

// Replaces the old `android { kotlinOptions { jvmTarget = '17' } }`. That block
// belongs to the Kotlin plugin we no longer apply; configuring the compiler
// through the `kotlin` extension is how it is done under Built-in Kotlin.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // The native Colada Android SDK (io.coladaapp:colada-android) is added in
    // Phase 5. colada-core arrives transitively via `api` and must not be
    // declared separately.
}
