name: CI

on:
  push:
    branches: [staging]
  pull_request:

# Pinned so a Flutter release can never silently change a build result: a red
# CI run is always caused by the commit under review. The cost of pinning is a
# blind spot — CI would stay green straight through a Flutter release that
# breaks this plugin — which the `latest-flutter` canary job below covers.
env:
  FLUTTER_VERSION: 3.44.8

jobs:
  analyze-and-test:
    name: Analyze, format & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  pigeon:
    name: Pigeon codegen is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      # Regenerate from the schema and fail if anything moved. A stale
      # generated file is the one way the three languages can silently disagree
      # about the contract, so it cannot be allowed to merge.
      - name: Regenerate
        # The format step matches the documented local command. Pigeon does not
        # emit dart-format-clean Dart, so without it this job and the format
        # job disagree about what the committed file should look like.
        run: |
          dart run pigeon --input pigeons/colada_api.dart
          dart format lib/src/messages.g.dart
      - name: Fail if the committed output is stale
        run: |
          if ! git diff --exit-code -- \
            lib/src/messages.g.dart \
            android/src/main/kotlin/io/coladaapp/sdk/flutter/Messages.g.kt \
            ios/colada_sdk/Sources/colada_sdk/Messages.g.swift; then
            echo "::error::Generated Pigeon files are out of date. Run:"
            echo "::error::  dart run pigeon --input pigeons/colada_api.dart"
            exit 1
          fi

  build-android:
    name: Build example (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build example APK
        # No-op until the example app lands in Phase 14. Wired now so the build
        # gate cannot be forgotten. Checks for pubspec.yaml, not just the
        # directory — example/README.md documents the intended app already,
        # which makes `-d example` true before the app itself is scaffolded.
        run: |
          if [ -f example/pubspec.yaml ]; then
            cd example && flutter pub get && flutter build apk --debug
          else
            echo "example/ app not scaffolded yet — skipping (wired for Phase 14)."
          fi

  build-ios:
    name: Build example (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build example iOS (no codesign)
        # No-op until the example app lands in Phase 14. Wired now so the build
        # gate cannot be forgotten. Checks for pubspec.yaml, not just the
        # directory — example/README.md documents the intended app already,
        # which makes `-d example` true before the app itself is scaffolded.
        run: |
          if [ -f example/pubspec.yaml ]; then
            cd example && flutter pub get && flutter build ios --no-codesign --debug
          else
            echo "example/ app not scaffolded yet — skipping (wired for Phase 14)."
          fi

  latest-flutter:
    name: Canary — newest stable Flutter (informational)
    runs-on: macos-latest
    # NEVER blocks a PR. Its only job is to notice, before a customer does,
    # that a new Flutter release has started rejecting something we ship.
    # Everything else in this workflow stays pinned and authoritative.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # No flutter-version: whatever stable is newest on the day this runs.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

      # The deprecations this job exists to catch — a plugin applying the
      # Kotlin Gradle Plugin, and a plugin with no Swift Package Manager
      # support — are reported by the Flutter tool only while BUILDING AN APP
      # that uses the plugin. Analyzing the package alone never surfaces them.
      # So until example/ lands in Phase 14, this job's coverage is Dart-level
      # only, and these two steps announce that rather than passing silently.
      - name: Build example (Android) on newest stable
        run: |
          if [ -f example/pubspec.yaml ]; then
            cd example && flutter pub get && flutter build apk --debug
          else
            echo "::warning::example/ is not scaffolded yet (Phase 14). The KGP and"
            echo "::warning::Swift Package Manager deprecations CANNOT be detected"
            echo "::warning::until it is — this canary is Dart-only for now."
          fi
      - name: Build example (iOS) on newest stable
        run: |
          if [ -f example/pubspec.yaml ]; then
            cd example && flutter build ios --no-codesign --debug
          fi

  integration-android:
    name: Integration tests (Android emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # example/ is not scaffolded yet (Phase 14) — README.md documents the intended
      # app, but there is no pubspec.yaml/integration_test/ for this job to run
      # against. Skip cleanly rather than fail on a missing pubspec.yaml.
      - run: cd example && flutter pub get
        if: hashFiles('example/pubspec.yaml') != ''
      # No tenant key in CI: the key-less tests (channel wiring, client-side
      # validation) run and prove the Dart<->native round trip on a real
      # emulator; the full backend flow self-skips. Supply COLADA_TENANT_KEY
      # locally to run everything — never store a key in CI.
      # iOS integration tests are expensive on hosted runners; run them locally
      # and record results in doc/MANUAL_TEST_MATRIX.md.
      - name: Run integration tests on an emulator
        if: hashFiles('example/pubspec.yaml') != ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          script: cd example && flutter test integration_test/colada_flow_test.dart

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan covers every commit, not just the tip.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Note: gitleaks-action requires GITLEAKS_LICENSE only for GitHub
          # *organization* accounts. This repo is under a user account, so no
          # license is needed. If it ever moves to an org, add the secret.

  no-private-refs:
    name: No private references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for internal-only references
        run: bash tool/check-no-private-refs.sh
