name: Publish to pub.dev

# Publishes the plugin to pub.dev on a version tag (e.g. v0.2.1) using GitHub
# Actions OIDC — no long-lived PUB_TOKEN is stored anywhere.
#
# One-time setup on pub.dev (package Admin tab -> Automated publishing):
#   - Enable "Publishing from GitHub Actions"
#   - Repository: 3laween/colada-sdk-flutter
#   - Tag pattern: v{{version}}
# The pushed tag's version MUST match `version:` in pubspec.yaml, or pub.dev
# rejects the OIDC request.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'   # v0.2.1, v1.0.0, v1.2.3-beta, ...

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for pub.dev OIDC authentication
    env:
      FLUTTER_VERSION: 3.44.8
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Validate (dry run)
        run: flutter pub publish --dry-run
      - name: Publish to pub.dev
        run: flutter pub publish --force
